<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#b51f2b">
<meta name="description" content="Contribuisci a rimettere in campo il calcetto della pausa pranzo.">
<title>Un calcio alla pausa — Raccolta fondi</title>
<style>
:root{
  --red:#bd2633; --red-dark:#851b25; --gray:#62666b; --gray-light:#f0f1f2;
  --ink:#25272a; --muted:#686b70; --line:#dedfe1; --white:#fff; --soft-red:#f9e9eb;
}
*{box-sizing:border-box}
body{margin:0;background:var(--gray-light);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}
.wrap{width:min(100% - 28px,740px);margin:24px auto}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--red-dark),var(--red) 66%,#d94a53);color:var(--white);padding:36px 28px;border-radius:22px 22px 0 0}
.hero:after{content:"⚽";position:absolute;right:18px;bottom:-35px;font-size:clamp(6rem,22vw,10rem);opacity:.13;transform:rotate(-18deg);pointer-events:none}
.eyebrow{font-size:.76rem;letter-spacing:.13em;text-transform:uppercase;color:#ffe3e5;font-weight:800}
h1{position:relative;z-index:1;font-size:clamp(2rem,7vw,3rem);line-height:1.05;letter-spacing:-.04em;margin:12px 0}
.intro{position:relative;z-index:1;color:#fff1f2;margin:0;max-width:52ch;font-size:1.04rem}
main{background:var(--white);padding:25px;border-radius:0 0 22px 22px;box-shadow:0 12px 36px #25272a12}
.overview{padding:0 0 22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.label{color:var(--gray);font-size:.76rem;font-weight:800;letter-spacing:.08em}
.total{font-size:clamp(2.1rem,8vw,3.1rem);line-height:1.1;letter-spacing:-.04em;font-weight:850;color:var(--red);margin:7px 0}
.overview-note{color:var(--muted);font-size:.9rem;margin:7px 0 0}
.phases{display:grid;gap:15px}
.phase{border:1px solid var(--line);border-left:5px solid var(--red);border-radius:14px;padding:18px;background:#fff}
.phase-top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.phase h2{font-size:1.05rem;margin:0;line-height:1.3;color:var(--ink)}
.phase-desc{font-size:.9rem;color:var(--muted);margin:5px 0 0}
.pill{font-size:.74rem;font-weight:800;padding:5px 9px;border-radius:99px;white-space:nowrap;background:#ededee;color:#55585c}
.pill.done{background:#f9e1e4;color:var(--red-dark)}.pill.active{background:#e8e9ea;color:#414449}
.phase-amount{font-size:1.5rem;font-weight:850;letter-spacing:-.025em;margin:12px 0 2px}
.phase-goal{font-size:.87rem;color:var(--muted);margin-bottom:12px}
.track{height:11px;background:#e5e6e8;border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--red-dark),var(--red));border-radius:99px;transition:width .25s}
.phase-stats{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:9px;flex-wrap:wrap;font-size:.86rem}
.percent{font-weight:850;color:var(--red-dark)}.remaining{color:var(--muted)}
.note{background:var(--gray-light);border-radius:12px;margin-top:22px;padding:16px;color:#4f5257;font-size:.92rem}
.note strong{color:var(--red-dark)}
footer{text-align:center;color:var(--muted);font-size:.78rem;padding:18px 12px}
@media(max-width:460px){.wrap{margin:12px auto}.hero,main{padding:23px 19px}.phase{padding:15px}.phase-top{gap:8px}.pill{font-size:.68rem}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow" id="eyebrow">La pausa pranzo scende in campo</div>
    <h1 id="title">Un calcio alla pausa!</h1>
    <p class="intro" id="intro">Basta riunioni: salviamo il calcetto e torniamo a fare gol in pausa pranzo!</p>
  </header>
  <main>
    <section class="overview" aria-labelledby="total-label">
      <div class="label" id="total-label">TOTALE RACCOLTO</div>
      <div class="total" id="grand-total">0 €</div>
      <p class="overview-note" id="overview-note"></p>
    </section>
    <section class="phases" id="phases" aria-label="Avanzamento dei due traguardi della raccolta"></section>
    <div class="note" id="note"></div>
  </main>
  <footer>Una raccolta tra colleghi, per tornare a giocare insieme.</footer>
</div>
<script>
/*
  AGGIORNAMENTO MANUALE:
  cambia i valori "raccolto" e "obiettivo" per ogni fase.
  Poi salva e carica il file aggiornato su GitHub Pages.
  Mantieni lo stesso indirizzo online per non cambiare il QR code.
*/
const raccolta = {
  etichetta: "ciao",
  titolo: "RIMETTIAMOLO IN GIOCO!",
  descrizione: "Il nostro calcetto ci ha regalato tante sfide e pause pranzo memorabili. Ora ha bisogno di noi: prima lo rimettiamo in funzione, poi lo trasformiamo nel campo da gioco che meritiamo.",
  messaggio: "ciao",
  fasi: [
    { titolo: "Il calcetto è fermo. La squadra no!", descrizione: "Contribuiamo tutti a rimetterlo in funzione. Il nostro primo obiettivo è semplice: tornare a giocare durante la pausa pranzo!", raccolto: 0, obiettivo:310 },
    { titolo: "Funziona di nuovo. Ora facciamolo brillare!", descrizione: "Con il prossimo traguardo lo rendiamo più bello, più completo e pronto per nuove sfide.", raccolto: 0, obiettivo:190  }
    { titolo: "Il resto è beneficienza.", descrizione: "Eventuali avanzi e surplus verranno donatiper le varie iniziative sostenute all'interno dell'azienda", raccolto: 0, obiettivo:10000  }
  ]
};
const euro = n => new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
const num = n => Number.isFinite(Number(n)) ? Math.max(0,Number(n)) : 0;
const pctFor = (raised,goal) => goal>0 ? Math.min(100,raised/goal*100) : 0;
document.title = raccolta.titolo + " — Raccolta fondi";
document.getElementById("eyebrow").textContent = raccolta.etichetta;
document.getElementById("title").textContent = raccolta.titolo;
document.getElementById("intro").textContent = raccolta.descrizione;
document.getElementById("note").innerHTML = "<strong>Facciamo squadra anche fuori dal campo.</strong> " + raccolta.messaggio;
const root = document.getElementById("phases");
let totalRaised=0,totalGoal=0;
raccolta.fasi.forEach((fase,index)=>{
  const raised=num(fase.raccolto),goal=num(fase.obiettivo),pct=pctFor(raised,goal);
  totalRaised+=raised;totalGoal+=goal;
  const status=goal>0&&raised>=goal?"Completato":raised>0?"In corso":"Da iniziare";
  const article=document.createElement("article");article.className="phase";
  article.innerHTML='<div class="phase-top"><div><h2></h2><p class="phase-desc"></p></div><span class="pill"></span></div><div class="phase-amount"></div><div class="phase-goal"></div><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div><div class="phase-stats"><span class="percent"></span><span class="remaining"></span></div>';
  article.querySelector("h2").textContent=(index+1)+". "+fase.titolo;
  article.querySelector(".phase-desc").textContent=fase.descrizione;
  const pill=article.querySelector(".pill");pill.textContent=status;if(status==="Completato")pill.classList.add("done");else if(status==="In corso")pill.classList.add("active");
  article.querySelector(".phase-amount").textContent=euro(raised)+" raccolti";
  article.querySelector(".phase-goal").textContent="Obiettivo: "+euro(goal);
  const track=article.querySelector(".track");track.setAttribute("aria-label","Avanzamento "+fase.titolo);track.setAttribute("aria-valuenow",String(Math.round(pct)));
  article.querySelector(".fill").style.width=pct+"%";
  article.querySelector(".percent").textContent=Math.round(pct)+"% raggiunto";
  article.querySelector(".remaining").textContent=goal>0&&raised>=goal?"Traguardo raggiunto!":"Mancano "+euro(Math.max(0,goal-raised));
  root.appendChild(article);
});
document.getElementById("grand-total").textContent=euro(totalRaised);
document.getElementById("overview-note").textContent="Obiettivo complessivo: "+euro(totalGoal)+". Ogni fase mostra il proprio avanzamento.";
</script>
</body>
</html>
